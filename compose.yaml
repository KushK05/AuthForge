services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: authforge
      POSTGRES_USER: authforge
      POSTGRES_PASSWORD: authforge
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U authforge -d authforge"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: redis-server --save "" --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "${REDIS_PORT:-6379}:6379"

  localstack:
    image: localstack/localstack:3.8
    environment:
      SERVICES: sqs,ses,s3
      AWS_DEFAULT_REGION: us-east-1
    ports:
      - "4566:4566"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  migrate:
    build:
      context: .
    command: npm run migrate
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://authforge:authforge@postgres:5432/authforge
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
    command: npm run start:api
    env_file:
      - path: .env
        required: false
    environment:
      HOST: 0.0.0.0
      DATABASE_URL: postgres://authforge:authforge@postgres:5432/authforge
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"

  worker:
    build:
      context: .
    command: npm run start:worker
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://authforge:authforge@postgres:5432/authforge
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres-data:
